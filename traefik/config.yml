api:
  dashboard: false
  debug: false
entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
serversTransport:
  insecureSkipVerify: true

certificatesResolvers:
  cloudflare:
    acme:
      email: xarthisius.kk@gmail.com
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
        # caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging
      dnsChallenge:
        provider: cloudflare
        #disablePropagationCheck: true # uncomment this if you have issues pulling certificates through cloudflare, By setting this flag to true disables the need to wait for the propagation of the TXT record to all authoritative name servers.
        #delayBeforeCheck: 60s # uncomment along with disablePropagationCheck if needed to ensure the TXT record is ready before verification is attempted 
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

providers:
  swarm:
    network: wt_proxy
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  # The `file` provider (extra.yml) is gone. It held the apex -> docs and
  # feedback -> Qualtrics redirect routers, which are now traefik labels on the
  # `vocabulary` service in docker-stack.yml. A bind-mounted file is never
  # interpolated by `docker stack config`, so those rules could not follow
  # ${domain} and hardcoded sivacor.org -- meaning any non-production host
  # served production host rules and requested ACME certs for them.
