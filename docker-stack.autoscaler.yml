# Autoscaling overlay -- merged on top of docker-stack.yml, never deployed alone.
#
#   docker stack config --compose-file docker-stack.yml \
#                       --compose-file docker-stack.autoscaler.yml | docker stack deploy ...
#
# `make dev` adds the second file only when SIVACOR_AUTOSCALING is set in .env.
#
# WHY THIS IS A SEPARATE FILE, and it is not tidiness. `docker stack config`
# interpolates the WHOLE input before deploying anything, so the `OS_CLOUD:?` guard
# below would fail the *entire stack* when it is unset -- not just this service. With
# the autoscaler inline, `deploy-sivacor` could not be brought up at all without
# OpenStack credentials, which breaks two things that matter:
#
#   * local and non-fleet deployments, which have no clouds.yaml and want none;
#   * the production rollout itself, which deliberately brings the stack up BEFORE a
#     fleet exists (see the plan's "Deploying P0" step 0). Inline, production would
#     need OpenStack credentials on day one AND would immediately start booting VMs
#     for any queued submission -- exactly the thing that rollout defers.
#
# Splitting also makes the state visible: whether autoscaling is on is readable from
# the deploy command, and removing the flag genuinely tears `wt_autoscaler` down,
# because `docker stack deploy` removes services absent from the merged file.
#
# The `celery` and `mongo` networks are defined in docker-stack.yml; this file relies
# on the merge and must not redeclare them.

services:
  # On-demand OpenStack worker instances (plan P3). Previously run by hand from a
  # checkout on the manager; this is the same controller as a stack service.
  #
  # ⚠️ THE HIGHEST-PRIVILEGE SERVICE IN THIS STACK. It holds an OpenStack
  # application credential and can create and delete instances across the whole
  # project -- including the manager it runs on, and any hand-made debug VM.
  # `SIVACOR_MAX_INSTANCES` bounds what it will create; nothing bounds what it can
  # delete except the tags it filters on. Treat clouds.yaml here the way the GPG
  # keyring is treated on `local_worker`.
  autoscaler:
    # The controller runs from the girder-sivacor image, not its own
    # (worker_sizing_plan.md S3, P0.5): assignment happens through Girder's model
    # layer in-process, which needs girder/girder_worker/girder_sivacor importable.
    # `beat` and `local_worker` already do exactly this with different entrypoints;
    # this is the third. `SIVACOR_AUTOSCALER_IMAGE` is retired.
    #
    # Pin this in .env. Both this file and docker-stack.yml default to `latest`, so
    # an unpinned deployment lets a merge to girder-sivacor main change what
    # production runs -- the P0.3 failure. girder-sivacor's CI now pushes
    # `sha-<short>` tags (added in P0.5) precisely so a deployment can pin; before
    # that it pushed `latest` only and pinning was not possible.
    image: ${GIRDER_SIVACOR_IMAGE:-docker.io/xarthisius/girder-sivacor:latest}
    # tini as PID 1, matching `beat` and `local_worker`. The image's own ENTRYPOINT
    # is gunicorn; this replaces it wholesale.
    entrypoint: ["/usr/bin/tini", "--", "sivacor-autoscaler"]
    networks:
      # Redis for queue depth and readiness markers, Mongo for the job documents.
      # Nothing else: it makes no HTTP calls and is not behind traefik.
      - celery
      - mongo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # The template is deploy-sivacor's file, not the autoscaler's, and it changes
      # far more often than the controller code -- MANAGER_TENANT_IP alone is a
      # per-rebuild edit. Baking it into the image would create two artifacts that
      # must agree, which is the argument P2.1 used to reject a Packer image.
      - ./worker-cloud-init.sh:/etc/sivacor/worker-cloud-init.sh:ro
      # The only way this process can reach OpenStack. Read-only, and the file stays
      # owned by the host user. `OS_*` environment variables work too -- openstacksdk
      # reads either -- but a bind mount keeps one more credential out of .env.
      #
      # Mounted at a neutral path and located via OS_CLIENT_CONFIG_FILE below, rather
      # than at `~/.config/openstack/clouds.yaml`. The old path was
      # /home/autoscaler/..., which does not exist in the girder-sivacor image (its
      # user is `girder`), so this had to move regardless; a fixed path under
      # /etc/sivacor -- where worker-cloud-init.sh already lives -- means the mount
      # no longer silently depends on which user the image happens to run as.
      # The host file must still be readable by uid 1000, exactly as before.
      - ${OS_CLOUDS_FILE:-/home/ubuntu/.config/openstack/clouds.yaml}:/etc/sivacor/clouds.yaml:ro
      # Pre-delete post-mortems. Must be a HOST path: the whole point is to outlive
      # the instance, and a directory inside the container dies with the container.
      # Treat it like a log with a researcher's data adjacent to it -- console
      # buffers are uncurated, and the controller writes each dump 0600.
      #
      # The container runs as uid 1000, so the host directory must be writable by it:
      #   mkdir -p ~/sivacor-diagnostics && sudo chown 1000:1000 ~/sivacor-diagnostics
      # Getting this wrong is silent-ish -- one warning per reap, then an empty
      # directory when someone finally goes looking for the dump.
      - ${SIVACOR_DIAGNOSTICS_HOSTPATH:-/home/ubuntu/sivacor-diagnostics}:/var/lib/sivacor/diagnostics
    environment:
      - OS_CLOUD=${OS_CLOUD:?OS_CLOUD must be set, naming an entry in clouds.yaml}
      # Where the bind-mounted clouds.yaml actually is. See the volume comment: this
      # decouples the credential's path from the image's user and home directory.
      - OS_CLIENT_CONFIG_FILE=/etc/sivacor/clouds.yaml
      # Which instances this controller owns. It tags every instance it creates with
      # `sivacor-deployment:<this>` and REQUIRES that tag on any instance it counts or
      # deletes, because production and the test mirror share one OpenStack project
      # (D3). Without it each controller sees the other's workers as available capacity
      # -- their claim markers live in the other deployment's Girder -- so a queued
      # submission gets no VM, and each reaps the other's SHUTOFFs. The Makefile
      # defaults it to `domain`; guard message has no hyphen on purpose (P5.0 trap).
      - SIVACOR_DEPLOYMENT=${SIVACOR_DEPLOYMENT:?SIVACOR_DEPLOYMENT must be set, normally the deployment domain}
      - SIVACOR_WORKER_TEMPLATE=/etc/sivacor/worker-cloud-init.sh
      # Two different Redis paths, deliberately. This service reaches the broker over
      # the overlay network by service name, so it does NOT depend on 6379 being
      # published -- which is what lets production run the autoscaler while keeping
      # P0 step 0's "do not publish Redis on production yet".
      - SIVACOR_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      # ...whereas this is what gets written into worker user-data, and a worker is
      # off-box: it must be the manager's TENANT address, never `redis` and never the
      # floating IP. Changes on every test-mirror rebuild.
      - SIVACOR_MANAGER_TENANT_IP=${SIVACOR_MANAGER_TENANT_IP:?SIVACOR_MANAGER_TENANT_IP must be set, the manager tenant address, not its floating ip}
      # Secrets injected into worker user-data (P2.2). Both must match the manager
      # byte for byte or workers cannot decrypt job secrets / reach the broker.
      - MASTER_KEY_HEX=${MASTER_KEY_HEX:?MASTER_KEY_HEX must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # Job documents come from Girder's database, not its REST API. No API key to
      # bootstrap (one cannot exist before Girder's first start, so the REST version
      # could not bring a fresh stack up in one pass), and no endpoint scoping to get
      # wrong -- `GET /job` silently filters to the calling user, which returned `[]`
      # on every tick for the controller's whole life. Reads only, so P0.5's
      # "housekeeping must stay HTTP" rule does not apply: that is about writes needing
      # `jobs.job.update.after`, which is bound only in the Girder server process.
      - GIRDER_MONGO_URI=mongodb://mongo:27017/girder
      # ...and, once targeted assignment is armed, this process PUBLISHES: it builds a
      # submission's celery chain with girder_sivacor's own builder and sends it to the
      # chosen instance's private queue. That needs the same broker girder and
      # local_worker use, by the same service name over the `celery` network. Without
      # these two the claim succeeds and the publish raises -- the submission is bound
      # to a worker that is never told, and sits until the server-side reaper fails it.
      # Kombu reads GIRDER_WORKER_BROKER via girder_worker's config; the backend is
      # needed because the chain's steps carry results.
      - GIRDER_WORKER_BROKER=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_WORKER_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      # Creating the head step's child job makes Girder emit a user notification, and
      # girder.notification defaults to localhost:6379 when this is unset -- so every
      # assignment logged a ConnectionError traceback before the "published submission"
      # line (mirror, 2026-08-19). Harmless in itself: the flush is caught, and the
      # chain still goes out. But it is a traceback per submission in the log an
      # operator reads to tell a healthy fleet from a sick one, and it silently drops
      # the researcher's notification for that step.
      - GIRDER_NOTIFICATION_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      # NOT for this process -- this is the public hostname written into worker
      # user-data, because a worker VM does reach Girder over HTTPS.
      - SIVACOR_GIRDER_HOST=girder.${domain}
      - SIVACOR_WORKER_IMAGE=${SIVACOR_WORKER_IMAGE:-}
      # What a worker VM's celery subscribes to. Empty leaves worker-cloud-init.sh's
      # own default, `sivacor,<its private queue>` -- both the shared dispatch queue
      # and its own, which is what every worker has always done. Set it to the private
      # word `private` once THIS deployment has armed targeted assignment and nothing
      # publishes to `sivacor` (worker_sizing_plan.md P2, rollout step 4). A word, not a
      # queue list: the private queue is `sivacor.<the VM's uuid>` and cannot be named
      # off-box, so a literal attempt arrives verbatim and the worker consumes nothing.
      #
      # A variable rather than an edit to the template because that file is ONE
      # checkout bind-mounted by the mirror and by production, which are at different
      # points of that rollout. Narrowing it in the file would take effect on the
      # flag-off deployment's next pull, whose workers would then consume nothing while
      # Girder kept publishing -- every submission stranded, fleet reading healthy.
      #
      # It also ends the one-flag rollback for this deployment: a worker that has
      # stopped consuming `sivacor` cannot serve a submission dispatched the old way.
      - SIVACOR_WORKER_QUEUES=${SIVACOR_WORKER_QUEUES:-}
      - SIVACOR_DISPATCH_QUEUE=${SIVACOR_DISPATCH_QUEUE:-sivacor}
      # Guardrails (D3): cap BELOW the OpenStack quota, since the same 25 instances
      # carry the manager, the test mirror and any hand-made debug VM.
      - SIVACOR_MAX_INSTANCES=${SIVACOR_MAX_INSTANCES:-5}
      # Must stay above the server's sivacor.max_runtime (168h, seeded in
      # setup_girder.py) or this deletes workers the reaper still considers
      # healthy. The 12h of headroom covers boot, a cold image pull (~15 GB for
      # MATLAB) and the post-run zip/upload/sign tail -- this ceiling has to
      # cover pull + run, not run alone. Raising it also raises the worst-case
      # bill for a VM whose self-shutdown never fires: 180h x 8 SU/hr = 1440 SU.
      - SIVACOR_MAX_LIFETIME_HOURS=${SIVACOR_MAX_LIFETIME_HOURS:-180}
      - SIVACOR_BREAKER_THRESHOLD=${SIVACOR_BREAKER_THRESHOLD:-3}
      - SIVACOR_INTERVAL=${SIVACOR_INTERVAL:-30}
      # D9. Unset = off, which is the safe default: arming this against a worker
      # image that does not write readiness markers deletes every healthy instance
      # once it passes the deadline. Set it only after confirming
      # `redis-cli KEYS 'sivacor:ready:*'` lists a live worker.
      - SIVACOR_PROVISION_DEADLINE_MINUTES=${SIVACOR_PROVISION_DEADLINE_MINUTES:-}
      # A keyless fleet is a legitimate posture but a terrible debugging one; the
      # controller warns at startup when this is empty. A key cannot be added later.
      - SIVACOR_OS_KEYPAIR=${SIVACOR_OS_KEYPAIR:-}
      - SIVACOR_OS_IMAGE=${SIVACOR_OS_IMAGE:-Featured-Ubuntu24}
      # m3.medium is the floor, and not for CPU: JS2 gives 20 GB of root disk to
      # m3.tiny/small/quad and 60 GB to everything above, and analysis images land
      # at run time (D4/D6). Larger flavors buy CPU and RAM, never disk.
      - SIVACOR_OS_FLAVOR=${SIVACOR_OS_FLAVOR:-m3.medium}
      - SIVACOR_OS_NETWORK=${SIVACOR_OS_NETWORK:-auto_allocated_network}
      - SIVACOR_OS_SECGROUPS=${SIVACOR_OS_SECGROUPS:-}
      # Where the controller dumps an instance's console log, Nova fault and action
      # log immediately BEFORE deleting it, when it is being reaped for a reason that
      # is not a clean finish. Unset disables capture.
      #
      # This exists because of 2026-08-10/11: three submissions were reaped for "no
      # heartbeat" after their worker powered itself off mid-run, and the controller
      # deleted each one ~17 min later -- taking the console buffer, the only record
      # of why, with it. A worker VM has no floating IP and its journal dies with its
      # disk, so this is the sole post-mortem that exists.
      - SIVACOR_DIAGNOSTICS_DIR=${SIVACOR_DIAGNOSTICS_DIR:-/var/lib/sivacor/diagnostics}
    # No extra_hosts: this process makes no HTTP call to Girder, so the floating-IP
    # hairpin problem (P1.3 finding 5) that every other service works around simply
    # does not arise here.
    deploy:
      # ⚠️ NEVER raise this. Two controllers see the same queue depth and the same
      # fleet, and both act on it: every submission gets two instances, and the
      # allocation burns at 8 SU/hr per surplus VM until someone notices. There is no
      # leader election and no locking -- `replicas: 1` IS the mutual exclusion.
      replicas: 1
      labels:
        - "traefik.enable=false"
      placement:
        constraints:
          # Bind-mounts the template and clouds.yaml from this node, and reaches
          # Redis as a peer of the stack. Same reasoning as the other pinned
          # services (P0.4).
          - "node.role == manager"
      restart_policy:
        condition: any
        delay: 30s
