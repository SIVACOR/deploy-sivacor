services:
  traefik:
    image: traefik:v3.6
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - ./traefik/acme.json:/acme.json:rw
      - ./traefik:/etc/traefik:ro
    deploy:
      replicas: 1
      labels:
        - traefik.enable=false
        - traefik.http.routers.traefik.entrypoints=http
        - traefik.http.routers.traefik.rule=Host(`traefik.${domain}`)
        - traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$2y$$05$$yPv8h3.V9P2MQqN08JHhcuTvcJmmyz4O84oRuBqoHerczO2tQJ8sG
        - traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.traefik.middlewares=traefik-https-redirect
        - traefik.http.routers.traefik-secure.entrypoints=https
        - traefik.http.routers.traefik-secure.rule=Host(`traefik.${domain}`)
        - traefik.http.routers.traefik-secure.middlewares=traefik-auth
        - traefik.http.routers.traefik-secure.tls=true
        - traefik.http.routers.traefik-secure.tls.certresolver=cloudflare
        # This is the ONLY router that requests a certificate. Every other
        # router carries a bare `tls=true` and is served from the resulting
        # store by SNI, so these two lines decide TLS for the whole stack.
        # A wildcard covers exactly one label: with domain=test.sivacor.org,
        # *.sivacor.org would NOT match submit.test.sivacor.org.
        - traefik.http.routers.traefik-secure.tls.domains[0].main=${domain}
        - traefik.http.routers.traefik-secure.tls.domains[0].sans=*.${domain}
        - traefik.http.routers.traefik-secure.service=api@internal
      placement:
        constraints:
          - "node.role == manager"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - CF_ZONE_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/dev/stdout"
      # Traefik's default log level is ERROR, which is why a stack that never
      # even attempts ACME looks completely silent. INFO shows certificate
      # acquisition; DEBUG adds lego's DNS-01 challenge steps and is what you
      # want when a cert is not appearing.
      #
      # Set here rather than in config.yml on purpose: that file is a bind mount
      # and `docker stack config` does not interpolate it, so ${...} would not
      # work there. CLI flags and --configFile coexist fine (verified).
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--configFile=/etc/traefik/config.yml"

  mongo:
    image: mongo:4.4
    networks:
      - mongo
    volumes:
      - mongo-data:/data/db
      - mongo-cfg:/data/configdb
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=false"
      # Local named volumes: rescheduled onto another node this comes up empty.
      placement:
        constraints:
          - "node.role == manager"

  submit:
    networks:
      - proxy
    image: ${AEA_SIVACOR_IMAGE:-xarthisius/aea-sivacor:latest}
    environment:
      # The UI reads this via $env/dynamic/public, so adapter-node picks it up at
      # RUNTIME -- no image rebuild needed to retarget a deployment. SvelteKit
      # serves it to the browser from /_app/env.js, which is the quickest way to
      # check what the client actually received:
      #   curl -s https://submit.${domain}/_app/env.js
      #
      # The name matters. src/lib/api.ts:54 reads env.PUBLIC_SIVACOR_API_URL and
      # falls back to a HARDCODED https://girder.sivacor.org/api/v1 -- so a typo
      # or the wrong name does not fail, it silently points the test UI at
      # production. Several .env* files in aea-sivacor define a bare
      # SIVACOR_API_URL, which is NOT read: $env/dynamic/public uses SvelteKit's
      # publicPrefix (PUBLIC_), unrelated to the adapter's envPrefix.
      #
      # Must keep the /api/v1 suffix: api.ts:190 does BASE_URL.replace('/api/v1', '')
      # to build folder links.
      - PUBLIC_SIVACOR_API_URL=https://girder.${domain}/api/v1
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=wt_proxy"
        - "traefik.http.routers.submit.rule=Host(`submit.${domain}`)"
        - "traefik.http.routers.submit.entrypoints=https"
        - "traefik.http.routers.submit.tls=true"
        - "traefik.http.routers.submit.service=submit"
        - "traefik.http.services.submit.loadbalancer.server.port=3000"
        - "traefik.http.services.submit.loadbalancer.passhostheader=true"
    extra_hosts:
      - "girder.${domain}:host-gateway" # for the local queue

  beat:
    image: ${GIRDER_SIVACOR_IMAGE:-docker.io/xarthisius/girder-sivacor:latest}
    networks:
      - celery
      - mongo
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DOMAIN=${domain}
      - GIRDER_MONGO_URI=mongodb://mongo:27017/girder
      - GIRDER_HOST=0.0.0.0
      - GIRDER_WORKER_BROKER=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_WORKER_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_NOTIFICATION_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      # Deliberately NOT derived from ${domain}: the envelope sender has to be
      # a mailbox the spacemail account is authorized to send as, and
      # admin@test.sivacor.org is not one. Override only if you have a real
      # mailbox for it.
      - GIRDER_SETTING_CORE_CONTACT_EMAIL_ADDRESS=${GIRDER_ADMIN_EMAIL:-admin@sivacor.org}
      - GIRDER_SETTING_CORE_EMAIL_FROM_ADDRESS=SIVACOR Admin <${GIRDER_ADMIN_EMAIL:-admin@sivacor.org}>
      - GIRDER_SETTING_CORE_EMAIL_HOST=https://girder.${domain}
      - GIRDER_SETTING_CORE_REGISTRATION_POLICY=approve
      - GIRDER_SETTING_CORE_SMTP_ENCRYPTION=ssl
      - GIRDER_SETTING_CORE_SMTP_HOST=mail.spacemail.com
      - GIRDER_SETTING_CORE_SMTP_PASSWORD=${GIRDER_SMTP_PASSWORD}
      - GIRDER_SETTING_CORE_SMTP_PORT=465
      - GIRDER_SETTING_CORE_SMTP_USERNAME=${GIRDER_SMTP_USERNAME}
      # Any NON-EMPTY value dumps mail to stdout instead of sending it --
      # including the string "false", since notifications.py:154 is a bare
      # os.environ.get() truthiness check. Leave it unset to send for real.
      - GIRDER_EMAIL_TO_CONSOLE=${GIRDER_EMAIL_TO_CONSOLE:-}
      - GIRDER_SETTING_USER_QUOTA_DEFAULT_USER_QUOTA=10000000000
      - HOSTDIR=/
      - GIRDER_SIVACOR_TRO_GPG_PASSPHRASE=${GIRDER_SIVACOR_TRO_GPG_PASSPHRASE}
      - GIRDER_SIVACOR_TRO_GPG_FINGERPRINT=${GIRDER_SIVACOR_TRO_GPG_FINGERPRINT}
      - MASTER_KEY_HEX=${MASTER_KEY_HEX}
    extra_hosts:
      - "girder.${domain}:host-gateway" # for the local queue
    entrypoint: ["/usr/bin/tini", "--", "celery", "--app=girder_worker.app", "beat", "--schedule=/home/girder/celerybeat-schedule", "--loglevel=INFO"]
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=false"
      # celerybeat-schedule is a local file: on another node beat would forget
      # when it last ran and re-fire every periodic task on startup.
      placement:
        constraints:
          - "node.role == manager"

  local_worker:
    image: ${GIRDER_SIVACOR_IMAGE:-docker.io/xarthisius/girder-sivacor:latest}
    # uid 1000 (girder) with the HOST's docker group as its primary group. This is
    # the only way a Swarm service gets socket access: `docker stack config` rejects
    # compose's `group_add`, so the `--group-add` trick the off-box workers use is
    # unavailable here.
    #
    # Why it is not hardcoded: the image bakes `groupadd -g 112 docker`
    # (Dockerfile:98), and a fresh JS2 Ubuntu 24.04 instance came up with GID **127**
    # -- so the long-held "JS2 is always 112" assumption is false. Left at 112 this
    # service silently loses the socket and every analysis container fails to start.
    # The Makefile discovers the real GID at deploy time, so there is nothing to keep
    # in sync by hand; `:?` is there because an empty value would render `user: 1000:`
    # and fail obscurely at task start.
    #
    # NO HYPHEN IN THE :? MESSAGE. compose parses the text after the first `-` as a
    # `:-` default, so `${x:?must be set - see Makefile}` silently resolves to
    # " see Makefile" instead of erroring. That renders `user: '1000: see Makefile'`
    # and the guard becomes a no-op. REDIS_PASSWORD's guard works because its message
    # happens to contain no hyphen.
    user: "1000:${docker_group:?docker_group must be set, the Makefile discovers it}"
    networks:
      - celery
      - mongo
    volumes:
      - ./volumes:/srv/data
      - /home/ubuntu/.gnupg:/home/girder/.gnupg
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/tmp:/tmp
    environment:
      - DOMAIN=${domain}
      - GIRDER_MONGO_URI=mongodb://mongo:27017/girder
      - GIRDER_HOST=0.0.0.0
      - GIRDER_WORKER_BROKER=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_WORKER_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_NOTIFICATION_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_LOCAL_FONTELLO_ARCHIVE=/girder/clients/web/static/built/fontello.zip
      # Deliberately NOT derived from ${domain}: the envelope sender has to be
      # a mailbox the spacemail account is authorized to send as, and
      # admin@test.sivacor.org is not one. Override only if you have a real
      # mailbox for it.
      - GIRDER_SETTING_CORE_CONTACT_EMAIL_ADDRESS=${GIRDER_ADMIN_EMAIL:-admin@sivacor.org}
      - GIRDER_SETTING_CORE_EMAIL_FROM_ADDRESS=SIVACOR Admin <${GIRDER_ADMIN_EMAIL:-admin@sivacor.org}>
      - GIRDER_SETTING_CORE_EMAIL_HOST=https://girder.${domain}
      - GIRDER_SETTING_CORE_SMTP_ENCRYPTION=ssl
      - GIRDER_SETTING_CORE_SMTP_HOST=mail.spacemail.com
      - GIRDER_SETTING_CORE_SMTP_PASSWORD=${GIRDER_SMTP_PASSWORD}
      - GIRDER_SETTING_CORE_SMTP_PORT=465
      - GIRDER_SETTING_CORE_SMTP_USERNAME=${GIRDER_SMTP_USERNAME}
      # Any NON-EMPTY value dumps mail to stdout instead of sending it --
      # including the string "false", since notifications.py:154 is a bare
      # os.environ.get() truthiness check. Leave it unset to send for real.
      - GIRDER_EMAIL_TO_CONSOLE=${GIRDER_EMAIL_TO_CONSOLE:-}
      - GIRDER_SETTING_USER_QUOTA_DEFAULT_USER_QUOTA=10000000000
      # GOSU_USER is NOT set: nothing in the plugin or the image reads it (there is
      # no gosu binary and no entrypoint script -- it is dead WholeTale config).
      # Socket access comes from the `user:` line above instead.
      - HOSTDIR=/
      - GIRDER_SIVACOR_TRO_GPG_PASSPHRASE=${GIRDER_SIVACOR_TRO_GPG_PASSPHRASE}
      - GIRDER_SIVACOR_TRO_GPG_FINGERPRINT=${GIRDER_SIVACOR_TRO_GPG_FINGERPRINT}
      # P0.8: the /home/ubuntu/deploy-dev default is a deploy-dev path inside
      # the production stack and is still unverified on the prod host. Kept as
      # the default so production behaviour is unchanged; override per host.
      - STATA_LICENSE_HOSTPATH=${STATA_LICENSE_HOSTPATH:-/home/ubuntu/deploy-dev/volumes/licenses/stata.lic.19}
      - DOCKER_HOST_TMP_ROOT=${DOCKER_HOST_TMP_ROOT:-/home/ubuntu/deploy-dev/volumes}
      - MASTER_KEY_HEX=${MASTER_KEY_HEX}
      # A stable, explicit private-queue name. Left unset, routing.py derives it
      # from the celery node name, which under Swarm is a task ID that changes
      # on every restart -- orphaning any chain already pinned to the old name.
      - SIVACOR_WORKER_QUEUE=sivacor.static-01
      # Periodic sweeps (retention, reaper) arrive with no submission and thus
      # no token to inherit. They mint their own admin token through the model
      # layer -- this worker has GIRDER_MONGO_URI -- so only the URL is needed.
      # The sweeps still go over HTTP: they have to execute in the Girder
      # server process, where jobs.job.update.after is bound.
      - GIRDER_API_URL=https://girder.${domain}/api/v1
    extra_hosts:
      - "girder.${domain}:host-gateway" # for the local queue
    # local:                 Girder core's own queue (deleteFolderTask,
    #                        importDataTask, ...). Core raises 503 if nothing
    #                        consumes it, so it must stay. Periodic
    #                        housekeeping (retention sweep, reaper) rides it
    #                        too -- all that matters is that it stays off the
    #                        dispatch queue, whose depth an autoscaler reads as
    #                        a count of submissions waiting for a worker. A
    #                        dedicated sivacor.maintenance queue bought nothing:
    #                        --concurrency is one pool shared across every queue
    #                        a worker consumes, so a separate name gives the
    #                        reaper no reserved slot.
    # sivacor:               shared dispatch queue new submissions land on.
    # sivacor.static-01:     this worker's private queue; a submission's chain
    #                        is pinned here after its first step.
    entrypoint: ["/usr/bin/tini", "--", "celery", "--app=girder_worker.app", "worker", "--queues=${SIVACOR_MANAGER_QUEUES:-local,sivacor.static-01}", "-c", "4", "--loglevel=INFO"]
    deploy:
      # Must stay at 1: two replicas would share one private queue name, and a
      # pinned step could land on the replica that lacks the workspace
      # directory. Scale inside the VM with -c, not with replicas.
      replicas: 1
      labels:
        - "traefik.enable=false"
      # Node-bound three times over: the GPG keyring and Stata license are
      # bind-mounted from this host, DOCKER_HOST_TMP_ROOT names paths on it, and
      # a chain pinned to sivacor.static-01 expects to find its workspace here.
      placement:
        constraints:
          - "node.role == manager"

  girder:
    image: ${GIRDER_SIVACOR_IMAGE:-docker.io/xarthisius/girder-sivacor:latest}
    networks:
      - proxy
      - celery
      - mongo
    volumes:
      - ./volumes/base:/srv/data/base
      - ./volumes/tmp:/tmp
    environment:
      - DOMAIN=${domain}
      - DASHBOARD_URL=https://dashboard.${domain}
      - GIRDER_MONGO_URI=mongodb://mongo:27017/girder
      - GIRDER_HOST=0.0.0.0
      - GIRDER_WORKER_BROKER=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_WORKER_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GIRDER_NOTIFICATION_REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/
      - GOSU_USER=1000:1000:${docker_group}
      - GOSU_CHOWN=/srv/data
      - GIRDER_LOCAL_FONTELLO_ARCHIVE=/girder/clients/web/static/built/fontello.zip
      - HOSTDIR=/
      - WATCHFILES_FORCE_POLLING=true
      - GIRDER_SIVACOR_TRO_GPG_PASSPHRASE=${GIRDER_SIVACOR_TRO_GPG_PASSPHRASE}
      - GIRDER_SIVACOR_TRO_GPG_FINGERPRINT=${GIRDER_SIVACOR_TRO_GPG_FINGERPRINT}
      # Deliberately NOT derived from ${domain}: the envelope sender has to be
      # a mailbox the spacemail account is authorized to send as, and
      # admin@test.sivacor.org is not one. Override only if you have a real
      # mailbox for it.
      - GIRDER_SETTING_CORE_CONTACT_EMAIL_ADDRESS=${GIRDER_ADMIN_EMAIL:-admin@sivacor.org}
      - GIRDER_SETTING_CORE_EMAIL_FROM_ADDRESS=SIVACOR Admin <${GIRDER_ADMIN_EMAIL:-admin@sivacor.org}>
      - GIRDER_SETTING_CORE_EMAIL_HOST=https://girder.${domain}
      - GIRDER_SETTING_CORE_SMTP_ENCRYPTION=ssl
      - GIRDER_SETTING_CORE_SMTP_HOST=mail.spacemail.com
      - GIRDER_SETTING_CORE_SMTP_PASSWORD=${GIRDER_SMTP_PASSWORD}
      - GIRDER_SETTING_CORE_SMTP_PORT=465
      - GIRDER_SETTING_CORE_SMTP_USERNAME=${GIRDER_SMTP_USERNAME}
      # Any NON-EMPTY value dumps mail to stdout instead of sending it --
      # including the string "false", since notifications.py:154 is a bare
      # os.environ.get() truthiness check. Leave it unset to send for real.
      - GIRDER_EMAIL_TO_CONSOLE=${GIRDER_EMAIL_TO_CONSOLE:-}
      - GIRDER_SETTING_USER_QUOTA_DEFAULT_USER_QUOTA=10000000000
      - DOCKER_HOST_TMP_ROOT=${DOCKER_HOST_TMP_ROOT:-/home/ubuntu/deploy-dev/volumes}
      # Must match the workers': the server encrypts job secrets, the worker
      # decrypts them. Both sides currently fall back to the same hardcoded
      # dummy key, so they agree only by accident.
      - MASTER_KEY_HEX=${MASTER_KEY_HEX}
    extra_hosts:
      - "girder.${domain}:host-gateway" # for the local queue
    deploy:
      replicas: 1
      # ./volumes/base is the filesystem assetstore, bind-mounted from this
      # node. Rescheduled elsewhere, every stored file disappears.
      placement:
        constraints:
          - "node.role == manager"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.girder.rule=Host(`girder.${domain}`)"
        - "traefik.http.routers.girder.entrypoints=https"
        - "traefik.http.routers.girder.tls=true"
        # THE wildcard certificate request for the whole stack lives here.
        #
        # It used to sit on the `traefik-secure` router, which is defined by
        # labels on the `traefik` service -- and that service carries
        # `traefik.enable=false`, which makes the swarm provider discard EVERY
        # label on it. So that router was never built, nothing ever asked for a
        # certificate, and acme.json stayed at `"Certificates": null` with no
        # error logged: nothing failed, nothing was attempted. Existing
        # deployments only looked healthy because Traefik keeps renewing certs
        # already in the store; a fresh host had nothing to renew.
        #
        # It lives on `girder` because that router must work for the stack to
        # function at all, so the cert request can never be silently dropped by
        # disabling some optional service. A wildcard covers exactly one label,
        # hence main=${domain} plus sans=*.${domain}.
        - "traefik.http.routers.girder.tls.certresolver=cloudflare"
        - "traefik.http.routers.girder.tls.domains[0].main=${domain}"
        - "traefik.http.routers.girder.tls.domains[0].sans=*.${domain}"
        - "traefik.http.services.girder.loadbalancer.server.port=8080"
        - "traefik.http.services.girder.loadbalancer.passhostheader=true"
        - "traefik.swarm.network=wt_proxy"

  redis:
    image: redis:7-bullseye
    networks:
      - celery
    volumes:
      - /home/ubuntu/redis_data:/data
    # Off-box workers reach the broker here, so it is no longer purely internal.
    # The celery message carries an admin-scoped Girder token in plaintext,
    # which makes broker confidentiality a security boundary, not a nicety.
    # `:?` is deliberate: an unset password would otherwise render as
    # `--requirepass ""`, which disables auth entirely -- on a *published* port.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ports:
      # mode: host bypasses the routing mesh, so this binds on the node itself.
      #
      # WARNING: Swarm cannot restrict a published port to one interface --
      # `host_ip` is rejected by `docker stack config`, so this listens on ALL
      # of the node's addresses, the floating IP included. The tenant-only
      # restriction MUST come from the JS2 security group: allow 6379 from the
      # project CIDR and nothing else. `requirepass` is the second layer, not
      # the first. Verify from outside the project that 6379 is unreachable.
      - target: 6379
        published: 6379
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=false"
      # Bind mount from this node, and it is the celery broker: moving it
      # loses queued submissions and the pending-log pubsub.
      placement:
        constraints:
          - "node.role == manager"

  vocabulary:
    image: docker.io/xarthisius/sivacor-vocabulary:latest
    networks:
      - proxy
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vocabulary.rule=Host(`vocabulary.${domain}`)"
        - "traefik.http.routers.vocabulary.entrypoints=https"
        - "traefik.http.routers.vocabulary.tls=true"
        - "traefik.http.services.vocabulary.loadbalancer.server.port=8080"
        - "traefik.http.services.vocabulary.loadbalancer.passhostheader=true"
        - "traefik.swarm.network=wt_proxy"
        # Two redirect-only routers, moved here from traefik/config.yml so they
        # follow ${domain} -- that file is a bind-mounted file provider, which
        # `docker stack config` never interpolates, so it hardcoded sivacor.org
        # and issued ACME requests for production names from any other host.
        #
        # They live on `vocabulary` only because a router needs *some* service
        # to attach to; the redirectregex middleware matches ^(.*) and answers
        # 302 before the backend is ever consulted, which is why the old
        # config.yml could get away with a service that had zero servers.
        #
        # No certresolver here: the traefik-secure router already requests
        # main=${domain} + sans=*.${domain}, which covers both the apex and
        # feedback.${domain}, and a bare tls=true is served from that store.
        - "traefik.http.routers.mainpage.rule=Host(`${domain}`)"
        - "traefik.http.routers.mainpage.entrypoints=https"
        - "traefik.http.routers.mainpage.tls=true"
        - "traefik.http.routers.mainpage.service=vocabulary"
        - "traefik.http.routers.mainpage.middlewares=mainpage-redirect"
        - "traefik.http.middlewares.mainpage-redirect.redirectregex.regex=^(.*)"
        - "traefik.http.middlewares.mainpage-redirect.redirectregex.replacement=${DOCS_URL:-https://docs.sivacor.org/}"
        - "traefik.http.middlewares.mainpage-redirect.redirectregex.permanent=false"
        - "traefik.http.routers.feedback.rule=Host(`feedback.${domain}`)"
        - "traefik.http.routers.feedback.entrypoints=https"
        - "traefik.http.routers.feedback.tls=true"
        - "traefik.http.routers.feedback.service=vocabulary"
        - "traefik.http.routers.feedback.middlewares=feedback-redirect"
        - "traefik.http.middlewares.feedback-redirect.redirectregex.regex=^(.*)"
        - "traefik.http.middlewares.feedback-redirect.redirectregex.replacement=${FEEDBACK_URL:-https://cornell.ca1.qualtrics.com/jfe/form/SV_bEnajmkM2qKBr0O}"
        - "traefik.http.middlewares.feedback-redirect.redirectregex.permanent=false"

networks:
  mongo:
    driver: overlay
  celery:
    driver: overlay
    attachable: true
  proxy:
    driver: overlay

volumes:
  mongo-data: {}
  mongo-cfg: {}
